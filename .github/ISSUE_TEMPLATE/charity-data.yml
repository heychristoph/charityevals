name: Charity data correction
description: For charities correcting data about their own organisation.
labels: [charity-data]
body:
  - type: input
    id: organisation
    attributes:
      label: Organisation
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: What to correct
      description: The page or model, and the figure or statement.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Source documents
      description: Annual reports, audited accounts, programme data. Attach files or link them.
