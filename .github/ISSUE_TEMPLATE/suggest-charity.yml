name: Suggest a charity
description: A charity you'd like to see evaluated.
labels: [suggestion]
body:
  - type: input
    id: name
    attributes:
      label: Charity name
    validations:
      required: true
  - type: input
    id: website
    attributes:
      label: Website
  - type: textarea
    id: evidence
    attributes:
      label: Published figures or evaluations
      description: Links to any cost-effectiveness figure, evaluation or impact report.
  - type: textarea
    id: why
    attributes:
      label: Why
