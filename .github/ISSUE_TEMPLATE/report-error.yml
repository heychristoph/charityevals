name: Report an error
description: A wrong number, source or statement on a model page.
labels: [error-report]
body:
  - type: input
    id: page
    attributes:
      label: Page URL
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model id
  - type: input
    id: row
    attributes:
      label: Row or figure
  - type: textarea
    id: problem
    attributes:
      label: What's wrong
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source
      description: A link or document that shows the correct figure.
