# "secrets" status: scans a pull request's commits for leaked keys, tokens and passwords with
# gitleaks, and fails when it finds one. Findings are redacted in the log. Adapted from
# donethatai/.github (run there by an organization ruleset); this personal repo keeps its own copy.
# pull_request_target runs this file from the default branch, so a pull request can't replace the
# scan with a no-op. It checks out only the base branch, without keeping the token; the pull
# request's commits are fetched as git objects, scanned, and never checked out or run. The
# gitleaks settings (.gitleaks.toml, .gitleaksignore) therefore also come from the base branch,
# and inline "gitleaks:allow" markers, which would come from the pull request, are ignored.
# The job's own check belongs to the base commit under pull_request_target, so the result is
# posted as the "secrets" commit status on the pull request's head.
name: Secrets

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  statuses: write

jobs:
  scan:
    concurrency:
      group: secret-scan-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Report pending on the pull request's head
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f state=pending -f context=secrets \
            -f description="Scanning the pull request's commits" -f target_url="$RUN_URL" >/dev/null

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0 # the base branch, with history
          persist-credentials: false

      # The token reaches this one fetch through the environment, never .git/config or argv.
      - name: Fetch the pull request's commits (not checked out)
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git fetch --no-tags origin "+refs/pull/$PR/head:refs/remotes/pull/head"

      - name: Install gitleaks v8.30.1
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          # Refuse a download that doesn't match the pinned checksum.
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      - name: Scan the pull request's commits
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --ignore-gitleaks-allow \
            --log-opts="$BASE_SHA..$HEAD_SHA" .

      - name: Report the result on the pull request's head
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = success ]; then
            state=success; description="No secrets found in the pull request's commits"
          else
            state=failure; description="Secret found, or the scan didn't finish; see the log"
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f state="$state" -f context=secrets \
            -f description="$description" -f target_url="$RUN_URL" >/dev/null
