# Rebuilds and deploys charityevals.org on every merge to main; Actions > Deploy >
# Run workflow redeploys by hand. The build runs the model checks first, so a model
# that no longer reproduces its source never ships.
#
# One-time setup: a Cloudflare account API token from the "Edit Cloudflare Workers"
# template, scoped to this account and the charityevals.org zone, stored as the
# repository secret CLOUDFLARE_API_TOKEN. The account id is in wrangler.jsonc.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer pending run replaces an older one. Every run
# deploys the tip of main, so nothing is dropped and a re-run can't roll back.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # A cold history cache rebuilds the library at every past model commit (about 45 minutes); warm, a few.
    timeout-minutes: 90
    steps:
      - name: Refuse refs other than main
        if: github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::Deploy runs only from main, not ${REF}."
          exit 1

      # Always the current tip of main, with full history for the /<id>/history pages.
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Show deployed commit
        run: echo "::notice::Deploying main at $(git rev-parse --short HEAD)"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json # engines.node
          cache: npm

      # wrangler is pinned through package-lock.json.
      - run: npm ci

      # The history pages' per-commit results (src/lib/history.ts), shared with CI's.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/history
          key: history-${{ github.sha }}
          restore-keys: history-

      - name: Build and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy

      # Saved even when a later step fails, so a cold cache warms up once rather than on every run.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: .cache/history
          key: history-${{ github.sha }}
